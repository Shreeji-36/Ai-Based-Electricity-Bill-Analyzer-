services:
  - type: web
    name: energy-intelligence-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://your-app.vercel.app
      - key: ADMIN_EMAIL
        value: orewashreeji36@gmail.com
      - key: ADMIN_PASSWORD
        sync: false